# Настройки инструментов бэкенда. Зависимости — в requirements*.in / requirements*.txt (lock с хешами).

[tool.ruff]
line-length = 120
target-version = "py312"
# backend/files ведёт Донир со своими правилами оформления; его тесты CI запускает отдельным шагом.
extend-exclude = ["files"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "PT", "RUF"]
# RUF001–003: кириллица в строках и комментариях — норма для проекта, а не «похожие символы».
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "contracts", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["db: нужен PostgreSQL с pgvector (переменная TEST_DATABASE_URL)"]
filterwarnings = ["error"]
