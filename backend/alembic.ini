# Alembic: схема БД. Обычно миграции применяет контейнер migrate (python -m backend.migrate).
# Вручную из корня репозитория: alembic -c backend/alembic.ini upgrade head
# Подключение берётся из POSTGRES_* (владелец схемы), а не из этого файла.

[alembic]
script_location = %(here)s/migrations
path_separator = os
