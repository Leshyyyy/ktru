server {
    listen 80;
    root /usr/share/nginx/html;

    # Лимит выше 50 МБ: сами 50 МБ проверяет приложение и отвечает 413 в нашем формате ошибок,
    # иначе nginx вернул бы свою HTML-страницу (см. openapi.yaml).
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Файлы сборки с хэшем в имени можно кэшировать навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Все остальные адреса — это страницы SPA: отдаём index.html, маршрут разберёт React Router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
