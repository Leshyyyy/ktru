server {
    # nginx-unprivileged: работает не от root, поэтому порт 8080, а не 80.
    listen 8080;
    root /usr/share/nginx/html;

    # Лимит выше 50 МБ: сами 50 МБ проверяет приложение и отвечает 413 в нашем формате ошибок,
    # иначе nginx вернул бы свою HTML-страницу (см. openapi.yaml).
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS Docker. Адрес api берём из переменной, чтобы nginx перерешал имя при каждом запросе:
    # без этого он запоминает адрес при старте, и после перезапуска api фронт отдаёт 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        # С переменной и без URI в proxy_pass путь запроса передаётся как есть: /api/v1/...
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Файлы сборки с хэшем в имени можно кэшировать навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Все остальные адреса — это страницы SPA: отдаём index.html, маршрут разберёт React Router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
